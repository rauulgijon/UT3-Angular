<div class="auth-container">
    <div class="card">
        <h2>Regístrate</h2>

        <div class="input-group">
            <label>Nombre de usuario</label>
            <input type="text" placeholder="Nombre de usuario" [(ngModel)]="username" />
        </div>

        <div class="input-group">
            <label>Nombre</label>
            <input type="text" placeholder="Nombre" [(ngModel)]="name" />
        </div>

        <div class="input-group">
            <label>Apellidos</label>
            <input type="text" placeholder="Apellidos" [(ngModel)]="surname" />
        </div>

        <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" placeholder="Correo electrónico" [(ngModel)]="email" />
        </div>

        <div class="input-group">
            <label>Contraseña</label>
            <input type="password" placeholder="Contraseña" [(ngModel)]="password" />
        </div>

        <button class="btn" (click)="registrar()">Registrarse</button>

        <a class="link" href="/">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>
