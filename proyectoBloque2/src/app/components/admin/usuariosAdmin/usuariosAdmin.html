<div class="admin-panel">
    <div class="header-row">
        <h1>Gestión de Usuarios</h1>
        <a href="/admin" class="btn-back">⬅ Volver al Panel</a>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <input type="text" [(ngModel)]="busqueda" (input)="filtrar()" placeholder="Buscar usuario...">
        </div>
        <button class="btn-add" (click)="mostrarFormulario = !mostrarFormulario">
            {{ mostrarFormulario ? 'Cancelar' : '+ Nuevo Usuario' }}
        </button>
    </div>

    <div class="form-container" *ngIf="mostrarFormulario">
        <h3>Datos del nuevo usuario</h3>
        <div class="form-grid">
            <input type="text" [(ngModel)]="nuevoUsuario.username" placeholder="Nombre de usuario (username)">
            <input type="email" [(ngModel)]="nuevoUsuario.email" placeholder="Email">
            <input type="password" [(ngModel)]="nuevoUsuario.password" placeholder="Contraseña">
            
            <select [(ngModel)]="nuevoUsuario.rol">
                <option value="jugador">Jugador</option>
                <option value="arbitro">Árbitro</option>
                <option value="admin">Admin</option>
            </select>

            <ng-container *ngIf="nuevoUsuario.rol === 'arbitro' || nuevoUsuario.rol === 'jugador'">
                <select [(ngModel)]="nuevoUsuario.deporte">
                    <option value="" disabled selected>Selecciona Deporte</option>
                    <option value="futbol">Fútbol</option>
                    <option value="baloncesto">Baloncesto</option>
                    <option value="tenis">Tenis</option>
                </select>
            </ng-container>

            <ng-container *ngIf="nuevoUsuario.rol === 'arbitro'">
                <input type="text" [(ngModel)]="nuevoUsuario.dni" placeholder="DNI">
                <input type="text" [(ngModel)]="nuevoUsuario.telefono" placeholder="Teléfono">
            </ng-container>
            
            <button class="btn-save" (click)="guardar()">Guardar</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Deporte</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of usuariosFiltrados">
                    <td style="font-weight: bold;">{{ user.username }}</td>
                    
                    <td>{{ user.email }}</td>
                    
                    <td>
                        <span class="badge" [ngClass]="user.rol">{{ user.rol | uppercase }}</span>
                    </td>
                    
                    <td>
                        <span *ngIf="user.deporte">{{ user.deporte | titlecase }}</span>
                        <span *ngIf="!user.deporte" style="color: #ccc;">-</span>
                    </td>

                    <td style="text-align: center;">
                        <button class="btn-delete" (click)="borrar(user._id)">🗑️</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
