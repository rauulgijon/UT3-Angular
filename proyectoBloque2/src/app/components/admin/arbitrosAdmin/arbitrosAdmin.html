<div class="admin-panel">
    <div class="header-row">
        <h1>Gestión de Árbitros</h1>
        <a href="/admin" class="btn-back">⬅ Volver al Panel</a>
    </div>

    <div class="form-container">
        <h3>Nuevo Árbitro</h3>
        <div class="form-grid">
            <input type="text" [(ngModel)]="nuevoArbitro.username" placeholder="Nombre de usuario">
            <input type="email" [(ngModel)]="nuevoArbitro.email" placeholder="Email">
            <input type="password" [(ngModel)]="nuevoArbitro.password" placeholder="Contraseña">
            
            <select [(ngModel)]="nuevoArbitro.deporte">
                <option value="" disabled selected>Selecciona Deporte</option>
                <option value="futbol">Fútbol</option>
                <option value="baloncesto">Baloncesto</option>
                <option value="tenis">Tenis</option>
            </select>
            
            <button class="btn-save" (click)="guardar()">Guardar</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Deporte</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let arbitro of listaArbitros">
                    <td style="font-weight: bold;">{{ arbitro.username }}</td>
                    <td>{{ arbitro.email }}</td>
                    <td>{{ arbitro.deporte | titlecase }}</td>
                    <td style="text-align: center;">
                        <button class="btn-delete" (click)="borrar(arbitro._id)">🗑️</button>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <p *ngIf="listaArbitros.length === 0" style="text-align:center; margin-top:20px; color: #666;">
            No hay árbitros registrados.
        </p>
    </div>
</div>
