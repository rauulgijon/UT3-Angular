<div class="admin-panel">
    <div class="header-row">
        <h1>Gestión de Árbitros</h1>
        <a href="/admin" class="btn-back">⬅ Volver al Panel</a>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <input type="text" placeholder="Buscar árbitro...">
        </div>
        
        <button class="btn-add">
            + Nuevo Árbitro
        </button>
    </div>

    <div class="form-container">
        <h3>Datos del Árbitro</h3>
        <div class="form-grid">
            <input type="text" placeholder="Nombre de usuario">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Contraseña">
            <input type="text" placeholder="DNI">
            <input type="text" placeholder="Teléfono">
            <select>
                <option value="" disabled selected>Selecciona Deporte</option>
                <option value="futbol">Fútbol</option>
                <option value="baloncesto">Baloncesto</option>
            </select>
            <button class="btn-save">Guardar</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>DNI</th>
                    <th>Deporte</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody>

                    <td>Mateu_Lahoz</td>

                    <td>12345678A</td>
                    <td>Fútbol</td>

                </tr>

                    <td>Arbitro_Basket</td>

                    <td>Baloncesto</td>
                    <td style="text-align: center;"><button class="btn-delete">🗑️</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
