<div class="arbitros-admin-container">
    
    <div class="header-actions" style="margin-bottom: 20px;">
        <a routerLink="/admin" class="btn-back" style="text-decoration: none; color: #94a3b8; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: color 0.2s;">
            ⬅ Volver al Panel
        </a>
    </div>

    <h2>Gestión de Árbitros</h2>

    <button class="btn-add" (click)="mostrarFormulario = true">
        + Registrar Nuevo Árbitro
    </button>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Árbitro</th>
                    <th>Contacto</th>
                    <th>DNI</th>
                    <th>Deporte</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let a of listaArbitros">
                    <td>
                        <div class="user-cell">
                            <div class="avatar">{{ a.username.charAt(0).toUpperCase() }}</div>
                            <span class="username">{{ a.username }}</span>
                        </div>
                    </td>
                    
                    <td>
                        <div class="contact-info">
                            <span>📧 {{ a.email }}</span>
                            <span *ngIf="a.telefono">📱 {{ a.telefono }}</span>
                        </div>
                    </td>

                    <td>{{ a.dni || '—' }}</td>

                    <td>
                        <span class="badge-sport" *ngIf="a.deporte">{{ a.deporte }}</span>
                        <span class="text-muted" *ngIf="!a.deporte">General</span>
                    </td>

                    <td>
                        <button class="btn-edit" (click)="editar(a)" title="Editar">✏️</button>
                        <button class="btn-delete" (click)="borrar(a._id)" title="Eliminar">🗑️</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="listaArbitros.length === 0" class="empty-state">
            <p>No hay árbitros registrados.</p>
        </div>
    </div>

    <div class="modal-overlay" *ngIf="mostrarFormulario">
        <div class="modal-content">
            <h3>{{ idEdicion ? 'Editar Árbitro' : 'Nuevo Árbitro' }}</h3>
            
            <form (ngSubmit)="guardar()">
                
                <div class="form-group-row">
                    <div class="form-group">
                        <label>Nombre de Usuario *</label>
                        <input type="text" [(ngModel)]="nuevoArbitro.username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" [(ngModel)]="nuevoArbitro.email" name="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña {{ idEdicion ? '(Dejar en blanco para no cambiar)' : '*' }}</label>
                    <input type="password" [(ngModel)]="nuevoArbitro.password" name="password" 
                           [required]="!idEdicion" placeholder="********">
                </div>

                <div class="form-group">
                    <label>Especialidad (Deporte)</label>
                    <select [(ngModel)]="nuevoArbitro.deporte" name="deporte">
                        <option value="">-- General / Varios --</option>
                        <option value="Fútbol">Fútbol</option>
                        <option value="Baloncesto">Baloncesto</option>
                        <option value="Tenis">Tenis</option>
                        <option value="Voleibol">Voleibol</option>
                    </select>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" [(ngModel)]="nuevoArbitro.dni" name="dni" placeholder="12345678X">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" [(ngModel)]="nuevoArbitro.telefono" name="telefono" placeholder="600 123 456">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" (click)="cerrarFormulario()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
