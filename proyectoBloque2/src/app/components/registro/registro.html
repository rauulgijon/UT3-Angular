<div class="auth-wrapper">
    <div class="registro-container">
        <h2>Crear Cuenta</h2>
        
        <input type="text" [(ngModel)]="username" placeholder="Nombre de Usuario" />
        <input type="email" [(ngModel)]="email" placeholder="Correo Electrónico" />
        <input type="password" [(ngModel)]="password" placeholder="Contraseña" />
        
        <button (click)="registrar()">Registrarse</button>

        <div class="footer-text">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión</a>
        </div>
    </div>
</div>
